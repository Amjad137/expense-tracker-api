version: '3.9'

services:

  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: expense_tracker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-expense_tracker_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-expense_tracker_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Expense Tracker API
  # =============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense_tracker_api
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      # Database
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-expense_tracker_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # JWT
      JWT_SECRET: ${JWT_SECRET:-ZXhwZW5zZVRyYWNrZXJTZWNyZXRLZXkxMjM0NTY3ODkwMTIzNDU2Nzg5MA==}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      # Spring
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
    name: expense_tracker_postgres_data
