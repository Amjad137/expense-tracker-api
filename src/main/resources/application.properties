spring.application.name=expense-tracker-api

# Server
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# DataSource — PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expense_tracker_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Test@123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP defaults are fine; tuned for prod)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# validate = Flyway owns DDL; Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT Configuration
# Secret must be Base64-encoded and at least 256 bits (32 chars before encoding)
application.jwt.secret=${JWT_SECRET:ZXhwZW5zZVRyYWNrZXJTZWNyZXRLZXkxMjM0NTY3ODkwMTIzNDU2Nzg5MA==}
# Access token: 15 minutes (in milliseconds)
application.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
# Refresh token: 7 days (in milliseconds)
application.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.filter=true

# Spring Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# Logging
logging.level.me.amjath=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
